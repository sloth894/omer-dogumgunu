<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ömer — The Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;800&family=DM+Serif+Display:ital@0;1&family=Fredoka:wght@500;700&family=Inter:wght@400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f4e7cf; --ink:#1a1410; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: Inter, system-ui, sans-serif; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:960px; height:540px; transform-origin:center center; }
  canvas { display:block; width:960px; height:540px; image-rendering:auto; border-radius:6px; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:5; }
  .overlay.show { display:flex; }

  /* ---------- password ---------- */
  #pw { background:#000; }
  #pw .q { font-family:'DM Serif Display', serif; font-size:56px; letter-spacing:2px; margin-bottom:28px; }
  #pw input { background:transparent; border:none; border-bottom:2px solid #fff; color:#fff; font-size:28px; text-align:center; width:280px; outline:none; font-family:Inter; padding:6px; letter-spacing:4px; }
  #pw .err { height:30px; margin-top:18px; color:#ff6b6b; font-size:18px; opacity:0; transition:opacity .2s; }
  #pw .hint { position:absolute; bottom:22px; font-size:12px; opacity:.35; letter-spacing:3px; }

  /* ---------- start ---------- */
  #start { background: radial-gradient(ellipse at center, #2a1d12 0%, #000 75%); text-align:center; }
  #start .t1 { font-family:'DM Serif Display', serif; font-size:24px; letter-spacing:10px; opacity:.7; }
  #start .t2 { font-family:'DM Serif Display', serif; font-size:110px; line-height:1; margin:6px 0 4px; color:var(--cream); text-shadow:0 0 40px rgba(255,190,90,.35); }
  #start .t3 { font-family:'DM Serif Display', serif; font-style:italic; font-size:22px; opacity:.75; margin-bottom:34px; }
  .btn { background:var(--cream); color:var(--ink); border:none; font-family:Inter; font-weight:800; font-size:20px; letter-spacing:3px; padding:14px 38px; border-radius:40px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .btn:hover { transform:scale(1.06); box-shadow:0 0 30px rgba(255,220,150,.5); }
  #start .keys { margin-top:34px; display:flex; gap:26px; font-size:14px; opacity:.8; }
  .kbd { display:inline-block; border:1.5px solid rgba(255,255,255,.6); border-radius:6px; padding:2px 8px; margin-right:6px; font-weight:600; }

  /* ---------- chapter card ---------- */
  #card { background:#000; text-align:center; }
  #card .n { font-size:16px; letter-spacing:12px; opacity:0; transform:translateY(10px); transition:all 1s; }
  #card .name { font-size:64px; margin-top:16px; opacity:0; transform:translateY(16px); transition:all 1.2s .4s; }
  #card .sub { font-size:16px; margin-top:22px; opacity:0; transition:all 1s 1.1s; letter-spacing:2px; }
  #card.in .n, #card.in .name, #card.in .sub { opacity:1; transform:none; }
  #card.in .n { opacity:.7; } #card.in .sub { opacity:.6; }

  /* ---------- memory modal ---------- */
  #mem { background:rgba(0,0,0,.72); backdrop-filter: blur(3px); }
  .polaroid { background:#fbf8f1; padding:14px 14px 18px; box-shadow:0 20px 60px rgba(0,0,0,.6); transform:rotate(-2deg) scale(.6); opacity:0; transition:all .45s cubic-bezier(.2,1.4,.4,1); position:relative; }
  #mem.show .polaroid { transform:rotate(-2deg) scale(1); opacity:1; }
  .crop { position:relative; overflow:hidden; height:340px; }
  .crop img { display:block; height:auto; }
  .ptitle { color:#3a2c20; font-family:'Special Elite', monospace; text-align:center; margin-top:10px; font-size:15px; }
  #monkey { position:absolute; font-size:56px; transform:translate(-50%,-55%) scale(0); transition:transform .4s cubic-bezier(.2,1.6,.4,1); pointer-events:none; }
  #monkey.on { transform:translate(-50%,-55%) scale(1); }
  .cbox { margin-top:22px; display:flex; align-items:center; gap:12px; background:#fff; color:#111; border-radius:18px; padding:10px 18px 10px 10px; min-height:58px; max-width:620px; font-size:19px; font-weight:600; opacity:0; transform:translateY(10px); transition:all .3s; }
  .cbox.on { opacity:1; transform:none; }
  .cbox .av { width:44px; height:44px; border-radius:50%; background-size:cover; background-position:center; flex:none; border:2px solid #222; }
  .next { margin-top:12px; font-size:13px; opacity:.6; letter-spacing:2px; }
  .flame { position:absolute; font-size:42px; pointer-events:none; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { 0%{ transform:translateY(0) scale(.6); opacity:0 } 15%{opacity:1} 100%{ transform:translateY(-420px) scale(1.4) rotate(20deg); opacity:0 } }
  .wrongtip { position:absolute; background:#fff; color:#111; font-weight:700; padding:6px 12px; border-radius:12px; font-size:16px; transform:translate(-50%,-120%); pointer-events:none; animation: pop 1.2s forwards; white-space:nowrap; }
  @keyframes pop { 0%{opacity:0; transform:translate(-50%,-90%)} 15%{opacity:1; transform:translate(-50%,-120%)} 80%{opacity:1} 100%{opacity:0} }

  /* ---------- collage ---------- */
  #collage { background: radial-gradient(ellipse at center, #3b1d5e 0%, #12061f 80%); }
  #collage .pc { position:absolute; background:#fbf8f1; padding:8px 8px 26px; box-shadow:0 14px 40px rgba(0,0,0,.6); transition: transform .8s cubic-bezier(.2,1.2,.4,1), opacity .5s; opacity:0; }
  #collage .pc .crop { height:200px; }
  #collage .cap { position:absolute; bottom:34px; font-family:'Fredoka'; font-size:26px; opacity:0; transition:opacity 1s; }

  /* ---------- letter ---------- */
  #letter { background:#0b0806; }
  .paper { width:620px; min-height:400px; background: #f3e6c9; background-image: radial-gradient(rgba(120,80,30,.12) 1px, transparent 1px); background-size: 4px 4px; color:#2b1f14; padding:38px 46px; box-shadow:0 30px 80px rgba(0,0,0,.8), inset 0 0 60px rgba(120,80,30,.25); font-family:'Special Elite', monospace; font-size:17px; line-height:1.6; transform: scaleY(0); transform-origin: top; transition: transform .9s cubic-bezier(.3,1.2,.4,1); white-space:pre-wrap; }
  #letter.open .paper { transform: scaleY(1); }
  .caret { display:inline-block; width:8px; height:18px; background:#2b1f14; vertical-align:-3px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0 } }

  /* ---------- final ---------- */
  #final { background: transparent; text-align:center; pointer-events:none; padding-bottom:150px; }
  #final .big { font-family:'Fredoka'; font-weight:700; font-size:60px; line-height:1.1; color:#fff; text-shadow:0 0 18px #ff4fd8, 0 0 40px #7b5cff; transform:scale(.3); opacity:0; transition: all 1s cubic-bezier(.2,1.5,.4,1); }
  #final .look { margin-top:40px; font-size:30px; font-weight:800; background:rgba(0,0,0,.55); padding:14px 28px; border-radius:40px; opacity:0; transform:translateY(20px); transition: all 1s; }
  #final.a .big { transform:scale(1); opacity:1; }
  #final.b .look { opacity:1; transform:none; }

  #hud-music { position:absolute; right:12px; top:10px; z-index:6; font-size:13px; opacity:.55; cursor:pointer; user-select:none; display:none; }
  #yt { position:fixed; left:-400px; top:-400px; width:200px; height:200px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hud-music">🔊 M: ses</div>

  <div id="pw" class="overlay show">
    <div class="q">Şifre?</div>
    <input id="pwin" type="password" autocomplete="off" spellcheck="false" autofocus>
    <div class="err" id="pwerr"></div>
    <div class="hint">ENTER ↵</div>
  </div>

  <div id="start" class="overlay">
    <div class="t1">A BIRTHDAY GAME</div>
    <div class="t2">ÖMER</div>
    <div class="t3">feat. Bot Ömer</div>
    <button class="btn" id="go">▶ BAŞLA</button>
    <div class="keys">
      <span><span class="kbd">← →</span>yürü</span>
      <span><span class="kbd">SPACE</span>zıpla</span>
      <span><span class="kbd">ENTER</span>devam</span>
      <span><span class="kbd">M</span>ses</span>
    </div>
  </div>

  <div id="card" class="overlay"><div class="n"></div><div class="name"></div><div class="sub"></div></div>

  <div id="mem" class="overlay">
    <div class="polaroid" id="pol">
      <div class="crop" id="pcrop"><img id="pimg" alt=""><div id="monkey">🐒</div></div>
    </div>
    <div class="cbox" id="cbox"><div class="av" id="cav"></div><div id="ctext"></div></div>
    <div class="next" id="cnext">ENTER ↵</div>
  </div>

  <div id="collage" class="overlay"><div class="cap">Bunları sen topladın.</div></div>
  <div id="letter" class="overlay"><div class="paper" id="paper"></div><div class="next" id="lnext" style="opacity:0">ENTER ↵</div></div>
  <div id="final" class="overlay">
    <div class="big">Doğum günün kutlu olsun<br>Ömer</div>
    <div class="look">Gerçek hediye için arkadaşına bak</div>
  </div>
</div></div>
<div id="yt"><div id="ytp"></div></div>
<script src="game.js?v=6"></script>
<script src="vural.js?v=6"></script>
<script src="can.js?v=6"></script>
<script src="ending.js?v=6"></script>
</body>
</html>
